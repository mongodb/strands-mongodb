name: Release - Python

# The half of packaging that publishes. Trusted publishing over OIDC: no API token exists in
# this repository, so there is no long-lived credential to leak or rotate. PyPI verifies the identity of
# this workflow file, in this repository, running in the `pypi` environment, and mints a token good for
# one upload. Change the filename or the environment name and the upload stops working until the
# publisher on PyPI is updated to match — that coupling is the security property, not an inconvenience.
#
# Asserted by tests/test_release_ci.py (AT-134 to AT-137), on the same principle as ci-python.yml: this
# file is the one part of the repository nothing else in the suite can execute, so the suite reads it as
# YAML and checks that it says what it has to say.

on:
  push:
    tags:
      # The tag pattern `pyproject.toml`'s `tag_regex` derives the version from. A `typescript-v*` tag
      # versions independently off the same repo and must not reach this workflow.
      - 'python-v*'

# Read-only by default. The publish job raises its own permissions, and nothing else here needs more.
permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    # The same scheme `ci-python.yml` uses, and for the same reason: nothing here should be allowed to
    # sit for six hours. `publish` is the one to read twice -- see the note on its own budget. `AT-165`.
    timeout-minutes: 20  # The whole unit tier on one interpreter, plus the gate's own checks.

    # The build tier, so the wheel and sdist are resolved from PyPI exactly as CI does it. Set here for
    # the same reason `ci-python.yml` sets it on one job: the artifact is the same on every interpreter.
    # No MONGODB_URI, deliberately: the contract tier has a job of its own below. Setting both here
    # would leave `hatch run cov` running the contract tier too, and then the selector running it a
    # second time -- twice the wall clock, and a coverage number measured against a different set of
    # tests than the one `ci-python.yml` measures.
    env:
      STRANDS_MONGODB_BUILD_TIER: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # hatch-vcs reads the tag from git metadata. A shallow clone has no tags, and the version
          # silently falls back to 0.0.0 — which is exactly the mistake `fallback_version` was made
          # unmistakable to catch.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install hatch
        run: pip install hatch

      - name: Check formatting
        run: hatch run format-check

      - name: Run linter
        run: hatch run lint

      - name: Type check
        run: hatch run typecheck

      # Both coverage floors, which run the unit tier on the way through.
      - name: Enforce both coverage floors
        run: hatch run cov

  contract:
    name: Contract tier
    runs-on: ubuntu-latest
    timeout-minutes: 15  # A container start plus the contract tier, as in CI.

    # A real MongoDB, supplied by the runner rather than by a secret -- the same container
    # `ci-python.yml` gives its contract job, for the same reason it costs nothing. A release workflow
    # holding a cluster credential would reintroduce by the back door the long-lived secret that
    # trusted publishing exists to remove.
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # Under env: rather than on the command line, because REQ-E-108 is written about every connection
    # string rather than only the secret ones.
    env:
      MONGODB_URI: mongodb://localhost:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install hatch
        run: pip install hatch

      # The tier that needs a real server. It was absent from this workflow while it was absent from
      # CI, on the reasoning that a tag is not the moment to discover a credential is missing -- which
      # was right about a credential and wrong about the tier, because the tier never needed one.
      # `-m contract` rather than a bare `hatch run test`: without the selector an unanswered server
      # reports the tier as skipped, and a skip is indistinguishable from a pass at exactly the moment
      # that matters.
      - name: Run the contract tier
        run: hatch run test -m contract

      # Here the gate guards the build rather than the tier: `build` checks out afresh, but a tier that
      # writes into the tree is a tier that could write into what gets packaged, and a tag is the worst
      # moment to find out. `REQ-E-167`.
      - name: Assert the tier left the working tree clean
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "The contract tier left files behind:"
            echo "$dirty"
            exit 1
          fi

  build:
    name: Build and verify the artifact
    needs: [gate, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 15  # A build of both artifacts and the checks that they are the right ones.

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install hatch
        run: pip install hatch

      - name: Build the wheel and the sdist
        run: hatch build

      # The built version has to be the tag, not near it. Compared as PEP 440 objects
      # rather than as strings, so `python-v0.1.0-rc1` and `python-v0.1.0rc1` are the same answer and a
      # genuinely different version still fails. A mismatch here means hatch-vcs saw a dirty tree or no
      # tag at all, and publishing it would put a `.dev` or `0.0.0` artifact on PyPI permanently.
      - name: The built version must equal the tag
        run: |
          python -m pip install --quiet packaging
          python - <<'PY'
          import os, pathlib, sys
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("python-v")
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel in dist/, found {[w.name for w in wheels]}")
          built = parse_wheel_filename(wheels[0].name)[1]
          if built != Version(tag):
              sys.exit(f"wheel is {built}, tag says {Version(tag)} ({wheels[0].name})")
          print(f"{wheels[0].name} matches tag {tag}")
          PY

      - name: Upload the artifact for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # This does not cut the approval short. A job waiting on an environment's required reviewers has not
    # started, and the budget only begins counting when it does; GitHub cancels an unapproved run after
    # thirty days on its own clock. What this bounds is the upload, once somebody has said yes.
    timeout-minutes: 10

    # The environment PyPI's publisher is bound to, and where the required reviewers live. A tag alone
    # does not publish: a human approves the deployment first, which is the last stop before an upload
    # that can never be replaced, only yanked.
    environment:
      name: pypi
      url: https://pypi.org/p/strands-mongodb

    permissions:
      # The OIDC token PyPI exchanges for a one-upload credential. The only permission raised anywhere
      # in this file, and the reason no secret appears in it.
      id-token: write

    steps:
      # Both actions in this job are pinned to a digest rather than to a tag, which is a stricter rule
      # than the one the rest of these workflows follow and is deliberately scoped to this job alone.
      # MongoDB's own zizmor policy is `actions/*: ref-pin`, so `actions/checkout@v7` elsewhere is correct
      # by that standard; what makes this job different is `id-token: write` below. `REQ-E-164`.
      - name: Download the artifact the build job verified
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-dist
          path: dist/

      # No `password:`. Trusted publishing supplies the credential; supplying a token here would defeat
      # the point of the environment binding above.
      # `release/v1` is a branch: whoever can move it can change what runs in the only job in this
      # repository holding the token PyPI exchanges for an upload credential, and the blast radius is
      # every install of this package. This digest is that branch as of 2026-07-28, and is the pin
      # `mongo-python-driver` carries for this same action.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          packages-dir: dist/
